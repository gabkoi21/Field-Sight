<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>FieldSight</title>
    <script>
      if (!/^\/(login|sign-in|accept-invitation|account-help|superadmin)(\/|$)/.test(location.pathname)) document.documentElement.setAttribute('data-startup-workspace', '');
    </script>
    <style>
      html { scrollbar-gutter: stable; font-family: Inter, Arial, sans-serif; }
      body { margin: 0; font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      .startup-navigation, .startup-header { display: none; }
      .startup-skeleton { padding: 32px; background: #f5f7fb; min-height: 100vh; box-sizing: border-box; }
      .startup-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .startup-heading { height: 24px; width: 180px; background: #e5eaf1; border-radius: 4px; margin-bottom: 24px; }
      .startup-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
      .startup-metrics i { display: block; height: 120px; background: white; border: 1px solid #d6e0ed; }
      .startup-panel { padding: 20px; background: white; border: 1px solid #d6e0ed; }
      .startup-panel i { display: block; height: 24px; margin: 16px 0; background: #edf1f6; border-radius: 4px; }
      html[data-startup-workspace] .startup-header { display: block; position: fixed; inset: 0 0 auto; height: 64px; box-sizing: border-box; background: white; border-bottom: 1px solid #d6e0ed; }
      html[data-startup-workspace] .startup-skeleton { padding-top: 96px; }
      .startup-navigation { position: fixed; top: 64px; bottom: 0; left: 0; width: 240px; box-sizing: border-box; border-right: 1px solid #173d6e; background: #071f47; color: #b5c7d5; font-family: Inter, Arial, sans-serif; flex-direction: column; }
      .startup-navigation nav { padding: 20px 12px 12px; min-height: 0; flex: 1; overflow-y: auto; }
      .startup-navigation section { margin-bottom: 16px; }
      .startup-navigation h2 { margin: 0 0 6px; padding: 0 12px; font-size: 11px; font-weight: 600; line-height: 17.05px; letter-spacing: 1.32px; text-transform: uppercase; color: #91a9bb; }
      .startup-navigation a { display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; margin: 2px 0; padding: 8px 12px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 14px; line-height: 20px; }
      .startup-navigation a[aria-current] { background: #0b51b780; color: white; font-weight: 600; }
      .startup-navigation svg { flex: none; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      @media (min-width: 1024px) { html[data-startup-workspace] .startup-navigation { display: flex; } html[data-startup-workspace] .startup-skeleton { margin-left: 240px; } }
      @media (max-width: 640px) { .startup-skeleton { padding: 16px; } .startup-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (prefers-reduced-motion: no-preference) { .startup-skeleton > div { animation: startup-pulse 1.5s ease-in-out infinite; } @keyframes startup-pulse { 50% { opacity: .5; } } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-header" aria-hidden="true"></div><aside class="startup-navigation" inert aria-hidden="true"><nav><section><h2>Project</h2><a href="/projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M8 10v7m4-7v4m4-4v7"/></svg><span>Projects</span></a><a href="/projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Overview</span></a><a href="/projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6m-6 4h6"/></svg><span>Details &amp; activity</span></a></section><section><h2>Results &amp; reporting</h2><a href="/dashboards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Project dashboards</span></a><a href="/reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z M14 2v6h6M8 16v2m4-5v5m4-8v8"/></svg><span>Reports</span></a></section><section><h2>Data operations</h2><a href="/forms/connections"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></svg><span>Kobo connections</span></a></section><section><h2>Administration</h2><a href="/settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span>Organization settings</span></a></section></nav></aside>
      <div role="status" aria-label="Loading FieldSight" class="startup-skeleton">
        <span class="startup-sr-only">Loading FieldSight…</span>
        <div aria-hidden="true">
          <div class="startup-heading"></div>
          <div class="startup-metrics"><i></i><i></i><i></i><i></i></div>
          <div class="startup-panel"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
    <script>
      const project = location.pathname.match(/^\/projects\/([^/]+)/)?.[1] || new URLSearchParams(location.search).get('project_id');
      const links = document.querySelectorAll('.startup-navigation nav a');
      if (project) {
        links[1].setAttribute('href', '/projects/' + encodeURIComponent(project) + '/overview');
        links[2].setAttribute('href', '/projects/' + encodeURIComponent(project) + '/details');
      }
      if (!project) for (const link of [links[1], links[2]]) { link.style.color = '#91a9bb'; link.style.opacity = '.6'; }
      for (const link of links) if (link.getAttribute('href') === location.pathname && (project || link === links[0] || link.getAttribute('href') !== '/projects')) link.setAttribute('aria-current', 'page');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
