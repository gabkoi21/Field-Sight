services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      FIELDSIGHT_ENVIRONMENT: production
      FIELDSIGHT_DATABASE_URL: sqlite:////data/fieldsight.db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - fieldsight_sqlite:/data

volumes:
  fieldsight_sqlite:
