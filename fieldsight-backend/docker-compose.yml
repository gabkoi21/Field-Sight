services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      FIELDSIGHT_ENVIRONMENT: production
      FIELDSIGHT_DATABASE_URL: ${FIELDSIGHT_DATABASE_URL:?Set FIELDSIGHT_DATABASE_URL to the Neon connection URL}
      FIELDSIGHT_SYNC_TELEMETRY_DIRECTORY: /data/sync-workers
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - fieldsight_sqlite:/data

  worker:
    build: .
    command: ["python", "-m", "app.core.sync_worker"]
    env_file:
      - .env
    environment:
      FIELDSIGHT_ENVIRONMENT: production
      FIELDSIGHT_DATABASE_URL: ${FIELDSIGHT_DATABASE_URL:?Set FIELDSIGHT_DATABASE_URL to the Neon connection URL}
      FIELDSIGHT_SYNC_TELEMETRY_DIRECTORY: /data/sync-workers
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - fieldsight_sqlite:/data

volumes:
  fieldsight_sqlite:
